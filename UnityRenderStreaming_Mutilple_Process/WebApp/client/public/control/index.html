<!DOCTYPE HTML>
<html>

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <link rel="icon" href="../images/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="css/style.css" />
  <title>Server Control</title>
</head>

<body>
  <script type="text/javascript" src="https://webrtc.github.io/adapter/adapter-latest.js"></script>
  <script src="https://unpkg.com/event-target@latest/min.js"></script>
  <script src="https://unpkg.com/resize-observer-polyfill@1.5.0/dist/ResizeObserver.global.js"></script>
  <script type="module" src="js/main.js"></script>
  <div id="container">
    <h1>服务控制器</h1>

    <div id="warning" hidden="true"></div>

    <div class="box">
      <span>Send Link to master server:</span>
      <input type="button" id="sendLinkMasterButton" value="LinkMaster" />
      Master IP:<input type="text" id="MasterIP" value="10.0.104.16" />
      Master Port:<input type="text" id="MasterPort" value="8080" />
    </div>
    <span>Slave server list:</span>
    <div class="box" id="SlaveSevers">
    </div>
  </div>
